<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>요트 시안 C — 항구 깃발</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--page);color:var(--ink);-webkit-text-size-adjust:100%;line-height:1.4}
.defs{position:absolute;width:0;height:0;overflow:hidden}
.demo-head{padding:16px;max-width:1240px;margin:0 auto}
.demo-head h1{font-size:20px;margin:0 0 4px}
.demo-head p{margin:0 0 10px;font-size:14px;opacity:.82}
.demo-head nav{font-size:13px;margin-bottom:10px;display:flex;gap:12px;flex-wrap:wrap}
.demo-head nav a{color:inherit}
.demo-bar{display:flex;flex-wrap:wrap;gap:8px}
.demo-bar button{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:inherit;font:inherit;font-size:14px;cursor:pointer}
.demo-bar button.primary{background:var(--brand);color:var(--on-brand);border-color:transparent;font-weight:700}
.demo-bar button[aria-pressed=true]{outline:2px solid var(--brand);outline-offset:1px}
.demo-bar .sep{flex-basis:100%;height:0}
.stage{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;justify-content:center;padding:0 16px 48px;max-width:1240px;margin:0 auto}
.frame-wrap{min-width:0;max-width:100%}
.frame-wrap.desk{flex:1 1 560px;max-width:760px}
.frame-wrap.phone{flex:0 0 auto;width:375px}
.frame-label{font-size:12px;opacity:.7;margin:0 0 6px;padding:0 4px}
.frame{container-type:inline-size;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--board-bg)}
@media (max-width:420px){.stage{padding:0 0 48px}.frame{border-radius:0;border-left:0;border-right:0}.frame-wrap.phone{width:100%}}

/* ── 게임판 뼈대 — 앱의 20-yacht-table.css 와 같은 구조(.yt-), 폭은 컨테이너 단위(cqi)로 ── */
.yt-table{position:relative;display:flex;flex-direction:column;gap:10px;padding:10px;color:var(--ink);font-size:13px}
.yt-table button{font-family:inherit;color:inherit}
.yt-header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.yt-badges{display:flex;flex-wrap:wrap;gap:6px}
.yt-badge{padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:12px;white-space:nowrap;line-height:1.5}
.yt-title{font-weight:700}
.yt-seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(clamp(120px,40%,170px),1fr));gap:6px;margin:0;padding:0;list-style:none}
.yt-seat{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:6px 8px;min-width:0;font-size:13px}
.yt-seat svg{flex:none}
.yt-seat-name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.yt-seat-total{margin-left:auto;font-variant-numeric:tabular-nums;position:relative}
.yt-seat-tag{padding:0 6px;border-radius:999px;border:1px solid var(--line);font-size:11px;white-space:nowrap}
.yt-felt{position:relative;display:flex;flex-direction:column;gap:8px;padding:12px 8px;overflow:hidden}
.yt-decor,.yt-fx{position:absolute;inset:0;pointer-events:none}
.yt-decor{z-index:0}
.yt-fx{z-index:3}
.yt-status{position:relative;z-index:4;display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:24px}
.yt-tray{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px}
.yt-dice{display:flex;justify-content:center;gap:clamp(6px,2cqi,12px);width:100%}
.yt-die{position:relative;width:clamp(48px,15cqi,64px);height:clamp(48px,15cqi,64px);padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.yt-die:disabled{cursor:default}
.yt-die-body{position:relative;z-index:1;display:block;width:100%;height:100%;transition:transform .2s cubic-bezier(.3,1.5,.5,1),box-shadow .2s,filter .2s}
.yt-die-body svg{display:block;width:100%;height:100%}
.yt-die-empty .yt-die-body{opacity:.4}
.yt-die-tag{position:absolute;z-index:2;left:50%;bottom:-27px;transform:translateX(-50%);font-size:11px;white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none}
.yt-die-held .yt-die-tag{opacity:1}
.yt-actions{margin-top:24px;min-height:44px;display:flex;align-items:center}
.yt-roll{min-height:44px;padding:0 22px;border:none;font-size:15px;font-weight:700;cursor:pointer}
.yt-roll:disabled{opacity:.5;cursor:default}
.yt-note{font-size:13px}
.yt-card{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px;font-variant-numeric:tabular-nums}
.yt-card th,.yt-card td{padding:4px 2px;text-align:center;position:relative;height:34px}
.yt-card .yt-cat{width:32%;padding-left:8px;text-align:left;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.yt-col{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.yt-row-sum th,.yt-row-sum td{font-size:12px}
.yt-row-total th,.yt-row-total td{font-weight:700}
.yt-pick{display:block;width:100%;min-height:28px;padding:0;background:transparent;border:0;font-weight:700;font-size:inherit;cursor:pointer}
.yt-end{display:flex;flex-direction:column;gap:8px;padding:14px}
.yt-end-title{margin:0;font-size:18px}
.yt-end-reason{margin:0;font-size:13px;opacity:.85}
.yt-end-best{margin:0;font-size:14px;font-weight:700}
.yt-end-list{margin:0;padding:0;list-style:none}
.yt-end-row{display:flex;gap:8px;padding:5px 0;align-items:center}
.yt-end-me{font-weight:700}
.yt-end-rank{min-width:40px}
.yt-end-total{margin-left:auto;font-variant-numeric:tabular-nums}
.yt-end-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.yt-fly{position:absolute;z-index:20;pointer-events:none;left:0;top:0}

/* 연출 줄이기 — OS 설정 또는 [연출 줄이기] 버튼. CSS 연출은 끝 상태로 바로 가고, JS 연출은 재생하지 않는다. */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
[data-motion=reduce] *,[data-motion=reduce] *::before,[data-motion=reduce] *::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}

/* ── 시안 C · 항구 깃발 ─────────────────────────────────────────────── */
:root{
  --font:"Avenir Next","Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --navy:#12305a;
  --page:#e3f4fb;--ink:#12305a;--ol:#12305a;--line:#12305a;--panel:#fff;--brand:#ff5a4d;--on-brand:#fff;
  --board-bg:#f3fbfe;
  --sky:#c4ebf9;--sea1:#55bfe8;--sea2:#1f86c9;--foam:#fff;
  --coral:#ff5a4d;--sun:#ffc93c;--mint:#22b99a;
  --cell:#fff;--cell-empty:rgba(18,48,90,.07);--total-bg:#12305a;--total-ink:#fff;
}
:root[data-theme=dark]{
  --page:#070f24;--ink:#eaf2ff;--ol:#03081a;--line:#4a6cb0;--panel:#182c57;--brand:#ff6b5e;--on-brand:#fff;
  --board-bg:#0c1836;
  --sky:#1a2a57;--sea1:#2259ad;--sea2:#0d2c68;--foam:#bcd6ff;
  --coral:#ff6b5e;--sun:#ffd257;--mint:#35d0b0;
  --cell:#1c3264;--cell-empty:rgba(255,255,255,.05);--total-bg:#ffd257;--total-ink:#12305a;
}
.yt-table{font-weight:600}
.yt-badge{border:2px solid var(--ol);background:var(--panel);font-weight:700}
.yt-title{background:var(--coral);color:#fff;letter-spacing:.04em}

/* 좌석 — 스티커 카드 + 삼각 깃발 */
.yt-seat{background:var(--panel);border:2.5px solid var(--ol);border-radius:13px;box-shadow:3px 3px 0 var(--ol)}
.yt-seat-name{font-weight:800}
.yt-seat-turn{box-shadow:3px 3px 0 var(--acc),0 0 0 3px var(--sun) inset}
.yt-seat-tag{border:0;background:var(--coral);color:#fff;font-weight:800}

/* 항구 — 하늘 + 바다, 주사위는 수면에 떠 있다 */
.yt-felt{border:3px solid var(--ol);border-radius:24px;background:var(--sky);box-shadow:5px 5px 0 var(--ol);padding:12px 10px 16px}
.yt-felt-myturn{animation:c-turn 1.8s ease-in-out infinite}
@keyframes c-turn{0%,100%{box-shadow:5px 5px 0 var(--ol),0 0 0 0 var(--sun)}50%{box-shadow:5px 5px 0 var(--ol),0 0 0 5px var(--sun)}}
.c-sun{position:absolute;right:18px;top:10px;width:34px;height:34px;border-radius:50%;background:var(--sun);border:2.5px solid var(--ol)}
:root[data-theme=dark] .c-sun{box-shadow:inset -9px -3px 0 rgba(3,8,26,.35)}
.c-sea{position:absolute;left:0;right:0;top:74px;bottom:0;background:linear-gradient(var(--sea1),var(--sea2))}
.c-wave{position:absolute;left:0;width:240%;height:12px;display:block}
.c-wave1{top:63px;fill:var(--sea1);animation:c-drift 7s linear infinite}
.c-wave2{top:92px;fill:none;stroke:var(--foam);stroke-width:2;stroke-linecap:round;opacity:.55;animation:c-drift 11s linear infinite reverse}
.c-wave3{top:128px;fill:none;stroke:var(--foam);stroke-width:2;stroke-linecap:round;opacity:.3;animation:c-drift 9s linear infinite}
@keyframes c-drift{from{transform:translateX(0)}to{transform:translateX(-4.5454%)}}
.yt-countdown::before{content:"";display:inline-block;width:7px;height:7px;margin-right:5px;border-radius:50%;background:var(--mint)}
.yt-felt .yt-badge-turn{background:var(--sun);color:var(--navy)}
.yt-felt .yt-countdown-urgent{background:var(--coral);color:#fff}
.yt-felt .yt-countdown-urgent::before{background:#fff}
.yt-felt .yt-celebrate{background:var(--coral);color:#fff}

/* 주사위 — 굵은 외곽선 스티커, 물 위에서 까딱 */
.yt-die-body{filter:drop-shadow(3px 4px 0 var(--ol));animation:c-bob 2.6s ease-in-out infinite;animation-delay:calc(var(--i) * -.52s)}
@keyframes c-bob{0%,100%{transform:translateY(-2px) rotate(-2deg)}50%{transform:translateY(3px) rotate(2deg)}}
.yt-die-held .yt-die-body{animation:none;transform:translateY(10px);filter:drop-shadow(1px 2px 0 var(--ol))}
.yt-die-empty .yt-die-body{animation:none}
.yt-die-tag{display:inline-flex;align-items:center;gap:3px;bottom:-31px;padding:1px 7px 1px 5px;border-radius:999px;background:var(--navy);color:#fff;font-weight:800;font-size:10.5px}
.yt-die-tag svg{display:block}
.yt-actions{margin-top:30px}
.yt-roll{border-radius:16px;border:3px solid var(--ol);background:var(--sun);color:var(--navy)!important;font-weight:800;font-size:16px;box-shadow:4px 4px 0 var(--ol);transition:transform .08s,box-shadow .08s}
.yt-roll:not(:disabled):active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ol)}
.yt-note{padding:4px 12px;border-radius:999px;background:var(--panel);border:2px solid var(--ol);font-weight:700}
.c-ripple{position:absolute;left:50%;bottom:-6px;width:120%;height:16px;margin-left:-60%;border-radius:50%;border:2.5px solid var(--foam);pointer-events:none;z-index:0}
.c-drop{position:absolute;left:50%;bottom:2px;width:6px;height:6px;border-radius:50% 50% 50% 0;background:var(--foam);pointer-events:none}

/* 점수표 — 색 블록 칸 */
.yt-card{border-collapse:separate;border-spacing:3px}
.yt-card th,.yt-card td{border-radius:8px;height:32px;padding:2px}
.yt-card .yt-cat{padding-left:8px;font-weight:700}
.yt-card thead .yt-col{background:var(--panel);border:2px solid var(--ol);border-bottom:5px solid var(--acc);font-weight:800}
.yt-card thead .yt-col-turn{background:var(--sun);color:var(--navy)}
.yt-cell{background:var(--cell-empty);font-weight:800;font-size:14px}
.yt-cell-written{background:var(--cell);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--line) 30%,transparent)}
.yt-cell-candidate{opacity:.55}
.yt-cell-pick{background:transparent;padding:0!important}
.yt-pick{height:30px;min-height:0;border:2px solid var(--ol);border-radius:8px;background:var(--sun);color:var(--navy)!important;font-weight:800;font-size:14px;box-shadow:2px 2px 0 var(--ol);transition:transform .08s,box-shadow .08s}
.yt-pick:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ol)}
.yt-pick:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ol)}
.yt-pick-zero{background:var(--panel);color:var(--ink)!important;opacity:.6;box-shadow:none;border-style:dashed}
.yt-row-sum .yt-cell{background:transparent;font-weight:700;opacity:.8}
.yt-row-total th,.yt-row-total td{background:var(--total-bg);color:var(--total-ink);font-size:15px}
.yt-cell-flash{animation:c-pop .7s cubic-bezier(.2,1.7,.4,1) .3s backwards}
@keyframes c-pop{0%{transform:scale(.3);background:var(--coral);color:#fff}55%{transform:scale(1.25);background:var(--sun);color:var(--navy)}100%{transform:scale(1)}}
.c-flag{width:22px;height:22px}
.c-flag svg{display:block;width:100%;height:100%}
.c-plus{position:absolute;right:0;top:-4px;padding:0 6px;border-radius:999px;background:var(--coral);color:#fff;font-weight:800;font-size:12px;border:2px solid var(--ol);pointer-events:none;white-space:nowrap}

/* 요트 축하 — 만국기 + 돛단배 + 스티커 */
.c-bunting{position:absolute;left:0;top:0;width:100%;height:52px;overflow:visible}
.c-bunting path.rope{fill:none;stroke:var(--ol);stroke-width:2}
.c-bunting .flag{stroke:var(--ol);stroke-width:2;stroke-linejoin:round;transform-box:fill-box;transform-origin:50% 0;animation:c-flagdrop .5s cubic-bezier(.2,1.8,.4,1) backwards,c-flagsway 1.1s ease-in-out .5s 2 alternate}
@keyframes c-flagdrop{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes c-flagsway{from{transform:skewX(-7deg)}to{transform:skewX(7deg)}}
.c-boat{position:absolute;left:0;top:34px;width:58px;height:54px}
.c-boat svg{display:block;width:100%;height:100%;animation:c-bob 1s ease-in-out infinite}
.c-sticker{position:absolute;left:50%;top:48%;padding:6px 18px;border-radius:14px;border:3px solid var(--ol);background:var(--sun);color:var(--navy);font-weight:800;font-size:24px;white-space:nowrap;box-shadow:5px 5px 0 var(--ol);animation:c-sticker 2.5s cubic-bezier(.2,1.6,.4,1) forwards}
.c-sticker small{font-size:13px;margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--coral);color:#fff;vertical-align:3px}
@keyframes c-sticker{0%{transform:translate(-50%,-50%) rotate(-18deg) scale(0)}14%{transform:translate(-50%,-50%) rotate(-6deg) scale(1.12)}20%,84%{transform:translate(-50%,-50%) rotate(-6deg) scale(1);opacity:1}100%{transform:translate(-50%,-50%) rotate(-6deg) scale(.8);opacity:0}}

/* 결과 — 시상대 스티커 */
.yt-end{background:var(--panel);border:3px solid var(--ol);border-radius:20px;box-shadow:5px 5px 0 var(--ol);animation:c-end .5s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes c-end{from{transform:scale(.85);opacity:0}}
.yt-end-title{font-weight:800;font-size:22px}
.yt-end-best-new{display:inline-block;align-self:flex-start;padding:2px 12px;border-radius:999px;background:var(--sun);color:var(--navy);border:2px solid var(--ol)}
.yt-end-row{padding:6px 10px;margin-bottom:4px;border-radius:10px;background:var(--cell-empty)}
.yt-end-row:first-child{background:var(--sun);color:var(--navy);border:2px solid var(--ol)}
.yt-end-rank{font-weight:800}
.yt-end .yt-badge{min-height:44px;padding:0 14px;cursor:pointer}

</style>
</head>
<body>

<div class="demo-head">
  <h1>요트 시안 C — 항구 깃발</h1>
  <p>맑은 항구의 스티커 그림책. 주사위가 물 위에 떠 있다가 물보라를 내며 뛰고, 요트가 나오면 만국기와 돛단배가 지나간다.</p>
  <nav><a href="option-a.html">시안 A</a><a href="option-b.html">시안 B</a><a href="option-c.html">시안 C</a><a href="README.md">설명</a></nav>
  <div class="demo-bar" role="group" aria-label="연출 재생">
    <button type="button" class="primary" data-demo="roll">굴려 보기</button>
    <button type="button" data-demo="rollall">5개 모두 굴리기</button>
    <button type="button" data-demo="yacht">요트 내 보기</button>
    <button type="button" data-demo="score">점수 기록해 보기</button>
    <button type="button" data-demo="result">결과 화면</button>
    <button type="button" data-demo="reset">처음으로</button>
    <span class="sep"></span>
    <button type="button" data-demo="theme">라이트 / 다크</button>
    <button type="button" data-demo="motion" aria-pressed="false">연출 줄이기</button>
  </div>
  <p style="margin:10px 0 0;font-size:13px">장면: 4인 · 내 차례 · 굴림 2/3 · 4 세 개 고정. 주사위를 누르면 고정, 점수표의 후보 칸을 누르면 기록됩니다.</p>
</div>
<main class="stage">
  <div class="frame-wrap desk"><p class="frame-label">데스크톱 폭 (게임판 최대 760px)</p><div class="frame"></div></div>
  <div class="frame-wrap phone"><p class="frame-label">휴대폰 375px</p><div class="frame"></div></div>
</main>
<script>
/* 시안 공용 도우미 — 눈 위치, 조각 날리기, 입자, 숫자 올리기. */
window.YT={
  PIPS:{1:[[50,50]],2:[[30,30],[70,70]],3:[[28,28],[50,50],[72,72]],4:[[30,30],[70,30],[30,70],[70,70]],5:[[28,28],[72,28],[50,50],[28,72],[72,72]],6:[[30,26],[70,26],[30,50],[70,50],[30,74],[70,74]]},
  /* from 사각형 → to 요소로 작은 조각을 포물선으로 날린다(프레임 좌표). */
  fly:function(frame,from,toEl,html,cls,dur){
    var fr=frame.getBoundingClientRect(),b=toEl.getBoundingClientRect();
    var ax=from.left+from.width/2-fr.left,ay=from.top+from.height/2-fr.top,dx=b.left+b.width/2-fr.left-ax,dy=b.top+b.height/2-fr.top-ay;
    var n=document.createElement('span');n.className='yt-fly '+cls;n.innerHTML=html;frame.appendChild(n);
    var base='translate('+ax+'px,'+ay+'px) translate(-50%,-50%) ';
    var an=n.animate([
      {transform:base+'translate(0,0) scale(.6)',opacity:0},
      {transform:base+'translate('+dx*.15+'px,'+(dy*.15-18)+'px) scale(1.15)',opacity:1,offset:.2},
      {transform:base+'translate('+dx*.6+'px,'+(dy*.6-34)+'px) scale(1.1)',opacity:1,offset:.6},
      {transform:base+'translate('+dx+'px,'+dy+'px) scale(.7)',opacity:.9}
    ],{duration:dur,easing:'ease-in-out'});
    an.onfinish=function(){n.remove()};return an;
  },
  burst:function(parent,n,cls,make){
    for(var k=0;k<n;k++){(function(k){var s=document.createElement('span');s.className=cls;parent.appendChild(s);var an=make(k,s);if(an)an.onfinish=function(){s.remove()};})(k)}
  },
  countUp:function(el,from,to,dur){
    if(!el)return;var t0=performance.now();
    (function step(t){var p=Math.min(1,Math.max(0,(t-t0)/dur));el.textContent=Math.round(from+(to-from)*p);if(p<1)requestAnimationFrame(step)})(t0);
  }
};

/* 시안 C · 항구 깃발 — 스티커 주사위, 물 위에서 뛰어 물보라, 깃발 꽂기, 만국기와 돛단배. */
window.THEME=(function(){
  var YT=window.YT,NAVY='#12305a';
  var FLAGS=['#ff5a4d','#ffc93c','#22b99a','#ffffff','#55bfe8'];
  function wave(cls,closed){
    var d='M0 6';for(var k=0;k<22;k++)d+=' q10 -7 20 0 t20 0';
    if(closed)d+=' V12 H0 Z';
    return '<svg class="c-wave '+cls+'" viewBox="0 0 880 12" preserveAspectRatio="none"><path d="'+d+'" vector-effect="non-scaling-stroke"/></svg>';
  }
  function die(f){
    var pips=f?YT.PIPS[f].map(function(p){return f===1?'<circle cx="50" cy="50" r="14" fill="#ff5a4d"/>':'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="9.2" fill="'+NAVY+'"/>'}).join(''):'';
    return '<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="5" y="5" width="90" height="90" rx="22" fill="#fff" stroke="'+NAVY+'" stroke-width="6"/>'+pips+'</svg>';
  }
  var PENNANT='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5v13" stroke="#12305a" stroke-width="2" stroke-linecap="round"/><path d="M4 2.5 14 6 4 9.5Z" fill="#ff5a4d" stroke="#12305a" stroke-width="1.3" stroke-linejoin="round"/></svg>';
  function splash(btn,delay){
    var r=document.createElement('span');r.className='c-ripple';btn.appendChild(r);
    r.animate([{transform:'scale(.3)',opacity:0},{transform:'scale(.5)',opacity:.95,offset:.1},{transform:'scale(1.25)',opacity:0}],{duration:520,delay:delay,easing:'ease-out',fill:'both'}).onfinish=function(){r.remove()};
    for(var j=-1;j<=1;j++){(function(j){
      var d=document.createElement('span');d.className='c-drop';btn.appendChild(d);
      d.animate([{transform:'translate(-50%,0) scale(.6)',opacity:0},{transform:'translate(calc(-50% + '+j*14+'px),-26px) scale(1)',opacity:1,offset:.45},{transform:'translate(calc(-50% + '+j*24+'px),4px) scale(.5)',opacity:0}],{duration:420,delay:delay,easing:'ease-out',fill:'both'}).onfinish=function(){d.remove()};
    })(j)}
  }
  return {
    accents:['#ff5a4d','#2b8fd6','#22b99a','#e0a100'],
    stagger:50,settleAt:.5,scoreDelay:300,
    die:die,
    holdTag:'<svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8" cy="3.6" r="1.7"/><path d="M8 5.4V14M5 7.6h6M2.6 10c.6 2.5 2.7 4 5.4 4s4.800-1.500 5.400-4"/></g></svg>고정',
    decor:function(){return '<span class="c-sun"></span><span class="c-sea"></span>'+wave('c-wave1',true)+wave('c-wave2')+wave('c-wave3')},
    seatIcon:function(){return '<svg viewBox="0 0 16 16" width="17" height="17" aria-hidden="true"><path d="M3 1.5v13" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/><path d="M4 2.5 14 6 4 9.500Z" fill="var(--acc)" stroke="var(--ol)" stroke-width="1.3" stroke-linejoin="round"/></svg>'},
    /* 눌렸다가 물 위로 뛰어올라 한 바퀴 돌고, 납작하게 내려앉으며 물보라. */
    roll:function(btn,body,k,c){
      var t=(k%2?-1:1)*360;
      body.animate([
        {transform:'translateY(0) rotate(0deg) scale(1,1)',offset:0},
        {transform:'translateY(7px) rotate(0deg) scale(1.16,.8)',offset:.12,easing:'ease-out'},
        {transform:'translateY(-62px) rotate('+t*.55+'deg) scale(.92,1.1)',offset:.46,easing:'ease-in'},
        {transform:'translateY(5px) rotate('+t+'deg) scale(1.2,.78)',offset:.78,easing:'ease-out'},
        {transform:'translateY(-7px) rotate('+t+'deg) scale(.96,1.05)',offset:.9},
        {transform:'translateY(0) rotate('+t+'deg) scale(1,1)',offset:1}
      ],{duration:c.dur,delay:c.delay,fill:'backwards'});
      splash(btn,c.delay+c.dur*.78);
    },
    /* 닻을 내리면 작은 물결. */
    hold:function(btn,held){if(held)splash(btn,60)},
    score:function(cell,frame,c){
      YT.fly(frame,c.from,cell,PENNANT,'c-flag',320);
      var p=document.createElement('span');p.className='c-plus';p.textContent='+'+c.pts;c.seat.querySelector('.yt-seat-total').appendChild(p);
      p.animate([{transform:'translateY(8px) scale(.5)',opacity:0},{transform:'translateY(-12px) scale(1.1)',opacity:1,offset:.25},{transform:'translateY(-16px) scale(1)',opacity:1,offset:.8},{transform:'translateY(-26px)',opacity:0}],{duration:1300,delay:300,fill:'both'}).onfinish=function(){p.remove()};
    },
    yacht:function(frame){
      var fx=frame.querySelector('.yt-fx'),w=fx.clientWidth,n=Math.max(7,Math.round(w/38)),flags='';
      for(var k=0;k<n;k++){var t=(k+.5)/n,x=w*t,y=4+88*t*(1-t);
        flags+='<path class="flag" style="animation-delay:'+k*45+'ms,'+(500+k*45)+'ms" fill="'+FLAGS[k%FLAGS.length]+'" d="M'+(x-10)+' '+y+' h20 l-10 19 Z"/>'}
      fx.innerHTML='<svg class="c-bunting" viewBox="0 0 '+w+' 52"><path class="rope" d="M0 4 Q'+w/2+' 48 '+w+' 4"/>'+flags+'</svg>'+
        '<div class="c-boat"><svg viewBox="0 0 58 54"><path d="M28 4 V40" stroke="#12305a" stroke-width="2.5" stroke-linecap="round"/><path d="M30 6 L50 36 H30 Z" fill="#fff" stroke="#12305a" stroke-width="2.5" stroke-linejoin="round"/><path d="M25 12 L10 36 H25 Z" fill="#ffc93c" stroke="#12305a" stroke-width="2.5" stroke-linejoin="round"/><path d="M4 40 H54 L46 51 H12 Z" fill="#ff5a4d" stroke="#12305a" stroke-width="2.5" stroke-linejoin="round"/></svg></div>'+
        '<div class="c-sticker">요트!<small>+50</small></div>';
      fx.querySelector('.c-boat').animate([{transform:'translateX(-70px)'},{transform:'translateX('+(w+20)+'px)'}],{duration:2400,easing:'ease-in-out',fill:'both'});
      [].forEach.call(frame.querySelectorAll('.yt-die'),function(btn,i){
        btn.querySelector('.yt-die-body').animate([
          {transform:'translateY(0) scale(1,1)'},{transform:'translateY(-26px) scale(.94,1.08)',offset:.45},{transform:'translateY(4px) scale(1.14,.84)',offset:.8},{transform:'translateY(0) scale(1,1)'}
        ],{duration:420,delay:200+i*90,iterations:2,easing:'ease-in-out'});
        splash(btn,200+i*90+336);
      });
      setTimeout(function(){fx.innerHTML=''},2600);
    }
  };
})();

/* 시안 장면·조작 — 앱 코드와 무관한 독립 데모. 연출만 THEME 훅이 맡는다. */
(function(){
'use strict';
var T=window.THEME,YT=window.YT,ROLL_MS=600; /* 앱 DiceTray.ROLL_ANIMATION_MS 와 같은 길이 */
var CATS=[['ONES','1'],['TWOS','2'],['THREES','3'],['FOURS','4'],['FIVES','5'],['SIXES','6'],['CHOICE','초이스'],['FOUR_OF_A_KIND','포 카드'],['FULL_HOUSE','풀 하우스'],['SMALL_STRAIGHT','스몰 스트레이트'],['LARGE_STRAIGHT','라지 스트레이트'],['YACHT','요트']];
var UPPER=['ONES','TWOS','THREES','FOURS','FIVES','SIXES'];
var REST=[-3,2,-1,3,-2];
/* 시안용 점수 계산 — 실제 앱은 서버가 후보 점수를 준다(클라 룰 미러 없음). */
function scoreOf(cat,d){
  var c=[0,0,0,0,0,0,0],sum=0;d.forEach(function(v){c[v]++;sum+=v});
  var u=UPPER.indexOf(cat);if(u>=0)return (u+1)*c[u+1];
  var mx=Math.max.apply(null,c),run=0,best=0;
  for(var i=1;i<=6;i++){run=c[i]?run+1:0;best=Math.max(best,run)}
  switch(cat){
    case 'CHOICE':return sum;
    case 'FOUR_OF_A_KIND':return mx>=4?sum:0;
    case 'FULL_HOUSE':return (mx===5||(c.indexOf(3)>0&&c.indexOf(2)>0))?sum:0;
    case 'SMALL_STRAIGHT':return best>=4?15:0;
    case 'LARGE_STRAIGHT':return best>=5?30:0;
    case 'YACHT':return mx===5?50:0;
  }
  return 0;
}
function init(){return{
  dice:[4,4,2,4,6],held:[true,true,false,true,false],rolls:2,turn:0,last:null,celebrate:null,result:false,seconds:18,
  seats:[
    {name:'미르',me:true,scores:{ONES:3,THREES:9,SIXES:18,FULL_HOUSE:22,SMALL_STRAIGHT:15}},
    {name:'하늘',scores:{ONES:2,FOURS:16,FIVES:15,CHOICE:23,LARGE_STRAIGHT:30}},
    {name:'도토리',scores:{TWOS:6,THREES:6,SIXES:24,FOUR_OF_A_KIND:26,SMALL_STRAIGHT:15}},
    {name:'봇 바다',scores:{ONES:4,FIVES:20,FULL_HOUSE:19,CHOICE:18,YACHT:0}}
  ]};}
var S=init(),busy=false,root=document.documentElement;
var motionReduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
root.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
function reduce(){return motionReduce}
function applyMotion(){root.dataset.motion=motionReduce?'reduce':'full';var b=document.querySelector('[data-demo=motion]');if(b)b.setAttribute('aria-pressed',String(motionReduce))}
var frames=[].slice.call(document.querySelectorAll('.frame'));
function totals(seat){var up=0,t=0;CATS.forEach(function(c){var v=seat.scores[c[0]];if(v==null)return;t+=v;if(UPPER.indexOf(c[0])>=0)up+=v});var bonus=up>=63?35:0;return{up:up,bonus:bonus,total:t+bonus}}
function cands(){var o={};if(!S.dice||S.turn<0)return o;var seat=S.seats[S.turn];CATS.forEach(function(c){if(seat.scores[c[0]]==null)o[c[0]]=scoreOf(c[0],S.dice)});return o}
function round(){return Math.min(12,Object.keys(S.seats[3].scores).length+1)}

function skeleton(){
  return '<div class="yt-table"><header class="yt-header"><div class="yt-badges"><span class="yt-badge yt-title">요트</span><span class="yt-badge" data-slot="round"></span><span class="yt-badge">차례 30초</span><span class="yt-badge">● 연결</span></div>'+
  '<div class="yt-badges"><span class="yt-badge">효과음</span><span class="yt-badge">채팅</span><span class="yt-badge">규칙</span><span class="yt-badge">나가기</span></div></header>'+
  '<ol class="yt-seats" aria-label="좌석"></ol>'+
  '<div class="yt-felt"><div class="yt-decor" aria-hidden="true">'+(T.decor?T.decor():'')+'</div><div class="yt-status"></div><section class="yt-tray" aria-label="주사위"></section><div class="yt-fx" aria-hidden="true"></div></div>'+
  '<div class="yt-endslot"></div><div class="yt-card-wrap"></div></div>';
}
function seatsHtml(){
  return S.seats.map(function(s,i){var turn=i===S.turn&&!S.result;
    return '<li class="yt-seat'+(turn?' yt-seat-turn':'')+'" data-seat="'+i+'" style="--acc:'+T.accents[i]+'">'+(T.seatIcon?T.seatIcon(i):'')+
      '<span class="yt-seat-name">'+s.name+(s.me?' (나)':'')+'</span><span class="yt-seat-total"><b class="yt-total-num">'+totals(s).total+'</b>점</span>'+
      (turn?'<span class="yt-seat-tag">차례</span>':'')+'</li>'}).join('');
}
function statusHtml(){var my=S.turn===0&&!S.result;
  if(S.result)return '';
  return '<span class="yt-badge yt-countdown'+(S.seconds<=5?' yt-countdown-urgent':'')+'" role="timer" aria-live="off"><span class="yt-count-num">'+S.seconds+'</span>초</span>'+
    (my?'<span class="yt-badge yt-badge-turn">내 차례</span>':'')+(S.celebrate?'<span class="yt-badge yt-celebrate">'+S.celebrate+'</span>':'');
}
function trayHtml(){var my=S.turn===0&&!S.result,canHold=my&&S.rolls>=1&&S.rolls<3,h='<div class="yt-dice" role="group">';
  for(var i=0;i<5;i++){var f=S.dice?S.dice[i]:null,held=S.held[i];
    h+='<button type="button" class="yt-die'+(held?' yt-die-held':'')+(f==null?' yt-die-empty':'')+'" data-die="'+i+'" style="--i:'+i+';--rest:'+REST[i]+'deg" aria-pressed="'+held+'" aria-label="'+(f==null?'주사위 '+(i+1)+' 비어 있음':'주사위 '+(i+1)+': '+f+(held?', 고정':''))+'"'+(canHold&&f!=null?'':' disabled')+'><span class="yt-die-body">'+T.die(f)+'</span><span class="yt-die-tag">'+(T.holdTag||'고정')+'</span></button>'}
  h+='</div><div class="yt-actions">'+(my?'<button type="button" class="yt-roll" data-act="roll"'+(S.rolls>=3?' disabled':'')+'>굴리기 · '+(3-S.rolls)+'번 남음</button>':'<span class="yt-note">'+(S.result?'판이 끝났어요':S.seats[S.turn].name+' 차례 · 굴림 '+S.rolls+'/3')+'</span>')+'</div>';
  return h;
}
function cardHtml(){var cd=cands(),my=S.turn===0&&S.rolls>=1&&!S.result;
  function cell(s,i,cat,label){var v=s.scores[cat],col=(i===S.turn&&!S.result?' yt-in-turn':'')+(i===0?' yt-in-me':'');
    if(v!=null){var fl=S.last&&S.last.seat===i&&S.last.cat===cat;return '<td class="yt-cell yt-cell-written'+col+(fl?' yt-cell-flash':'')+'"><span class="yt-num">'+v+'</span>'+(fl&&T.cellMark?T.cellMark():'')+'</td>'}
    var c=i===S.turn&&!S.result?cd[cat]:undefined;
    if(c!==undefined&&i===0&&my)return '<td class="yt-cell yt-cell-pick'+col+'"><button type="button" class="yt-pick'+(c===0?' yt-pick-zero':'')+'" data-score="'+cat+'" aria-label="'+label+'에 '+c+'점 기록">'+c+'</button></td>';
    return '<td class="yt-cell'+col+(c!==undefined?' yt-cell-candidate':'')+'">'+(c!==undefined?c:'')+'</td>'}
  function row(c){return '<tr'+(c[0]==='SIXES'?' class="yt-row-upper-end"':'')+'><th scope="row" class="yt-cat">'+c[1]+'</th>'+S.seats.map(function(s,i){return cell(s,i,c[0],c[1])}).join('')+'</tr>'}
  var tt=S.seats.map(totals);
  function sum(label,cls,fn){return '<tr class="'+cls+'"><th scope="row" class="yt-cat">'+label+'</th>'+tt.map(function(t,i){return '<td class="yt-cell'+(i===S.turn&&!S.result?' yt-in-turn':'')+(i===0?' yt-in-me':'')+'">'+fn(t)+'</td>'}).join('')+'</tr>'}
  return '<table class="yt-card" aria-label="점수표"><thead><tr><th scope="col" class="yt-cat">칸</th>'+S.seats.map(function(s,i){return '<th scope="col" class="yt-col'+(i===S.turn&&!S.result?' yt-col-turn':'')+'" style="--acc:'+T.accents[i]+'">'+(s.me?'나':s.name)+'</th>'}).join('')+'</tr></thead><tbody>'+
    CATS.slice(0,6).map(row).join('')+sum('상단 소계','yt-row-sum',function(t){return t.up+'/63'})+sum('보너스','yt-row-sum',function(t){return t.bonus?'+35':'-'})+
    CATS.slice(6).map(row).join('')+sum('총점','yt-row-total',function(t){return t.total})+'</tbody></table>';
}
function endHtml(){if(!S.result)return '';
  var rows=[[1,'미르',true,212],[2,'하늘',false,198],[3,'도토리',false,176],[4,'봇 바다',false,151]];
  return '<section class="yt-end" aria-label="게임 결과"><h2 class="yt-end-title">결과</h2><p class="yt-end-reason">12칸을 모두 채웠습니다.</p><p class="yt-end-best yt-end-best-new">새 최고 기록! (이전 187점)</p><ol class="yt-end-list">'+
    rows.map(function(r){return '<li class="yt-end-row'+(r[2]?' yt-end-me':'')+'"><span class="yt-end-rank">'+r[0]+'위</span><span class="yt-end-name">'+r[1]+(r[2]?' (나)':'')+'</span><span class="yt-end-total">'+r[3]+'점</span></li>'}).join('')+
    '</ol><div class="yt-end-actions"><button type="button" class="yt-roll">대기실로</button><button type="button" class="yt-badge">메인으로</button></div></section>';
}
function render(){
  frames.forEach(function(f){
    if(!f.firstChild)f.innerHTML=skeleton();
    f.querySelector('[data-slot=round]').textContent=round()+'/12 라운드';
    f.querySelector('.yt-seats').innerHTML=seatsHtml();
    var felt=f.querySelector('.yt-felt');felt.classList.toggle('yt-felt-myturn',S.turn===0&&!S.result);felt.style.setProperty('--acc',T.accents[0]);
    f.querySelector('.yt-status').innerHTML=statusHtml();
    f.querySelector('.yt-tray').innerHTML=trayHtml();
    f.querySelector('.yt-fx').innerHTML='';
    f.querySelector('.yt-endslot').innerHTML=endHtml();
    f.querySelector('.yt-card-wrap').innerHTML=cardHtml();
  });
}
function five(){return S.dice&&S.dice.every(function(v){return v===S.dice[0]})}
function celebrate(label){
  S.celebrate=label;
  frames.forEach(function(f){f.querySelector('.yt-status').innerHTML=statusHtml();if(!reduce()&&T.yacht)T.yacht(f)});
}
function playRoll(prevHeld){
  var maxDelay=0;
  frames.forEach(function(f){var k=0;
    [].forEach.call(f.querySelectorAll('.yt-die'),function(btn,i){
      if(prevHeld[i])return;var body=btn.querySelector('.yt-die-body'),fin=S.dice[i];
      if(reduce())return; /* 연출 줄이기 — 눈만 바로 바뀐다 */
      var delay=k*(T.stagger||40);maxDelay=Math.max(maxDelay,delay);
      var fl=setInterval(function(){body.innerHTML=T.die(1+Math.floor(Math.random()*6))},70);
      setTimeout(function(){clearInterval(fl);body.innerHTML=T.die(fin)},delay+ROLL_MS*(T.settleAt||.6));
      T.roll(btn,body,k,{delay:delay,dur:ROLL_MS,rest:REST[i],frame:f});k++;
    });
    if(!reduce()&&T.land)T.land(f,ROLL_MS);
  });
  busy=true;
  setTimeout(function(){busy=false;if(five())celebrate('요트! 다섯 개 모두 '+S.dice[0])},reduce()?180:ROLL_MS+maxDelay+60);
}
function roll(forced){
  if(busy)return;
  if(S.result||S.turn!==0||S.rolls>=3)S=init();
  var prev=S.held.slice();if(prev.every(Boolean))return;
  S.dice=(S.dice||[1,1,1,1,1]).map(function(v,i){return prev[i]?v:(forced?forced[i]:1+Math.floor(Math.random()*6))});
  S.rolls++;S.last=null;S.celebrate=null;render();playRoll(prev);
}
function toggleHold(i){
  if(busy||S.turn!==0||S.rolls<1||S.rolls>=3)return;
  S.held[i]=!S.held[i];
  frames.forEach(function(f){var b=f.querySelectorAll('.yt-die')[i];b.classList.toggle('yt-die-held',S.held[i]);b.setAttribute('aria-pressed',String(S.held[i]));if(!reduce()&&T.hold)T.hold(b,S.held[i],f)});
}
function score(cat){
  if(busy||!cat||S.turn!==0||S.rolls<1||S.seats[0].scores[cat]!=null)return;
  var pts=scoreOf(cat,S.dice),before=totals(S.seats[0]).total,origins=frames.map(function(f){return f.querySelector('.yt-dice').getBoundingClientRect()});
  S.seats[0].scores[cat]=pts;S.last={seat:0,cat:cat,pts:pts};
  var big=(cat==='YACHT'||cat==='LARGE_STRAIGHT')&&pts>0;
  S.turn=1;S.dice=null;S.held=[false,false,false,false,false];S.rolls=0;S.celebrate=null;S.seconds=30;render();
  var after=totals(S.seats[0]).total;
  frames.forEach(function(f,idx){
    if(reduce())return;
    var cell=f.querySelector('.yt-cell-flash'),seat=f.querySelector('.yt-seat[data-seat="0"]'),num=seat.querySelector('.yt-total-num');
    num.textContent=before;setTimeout(function(){YT.countUp(num,before,after,450)},T.scoreDelay||0);
    if(T.score)T.score(cell,f,{pts:pts,seat:seat,from:origins[idx]});
  });
  if(big)celebrate(cat==='YACHT'?'요트! +50':'라지 스트레이트! +30');
}
function bestPick(){var cd=cands(),best=null;Object.keys(cd).forEach(function(c){if(best===null||cd[c]>cd[best])best=c});return best}

frames.forEach(function(f){f.addEventListener('click',function(e){
  var d=e.target.closest('[data-die]');if(d){toggleHold(+d.dataset.die);return}
  if(e.target.closest('[data-act=roll]')){roll();return}
  var p=e.target.closest('[data-score]');if(p)score(p.dataset.score);
})});
document.querySelector('.demo-bar').addEventListener('click',function(e){
  var b=e.target.closest('[data-demo]');if(!b)return;
  switch(b.dataset.demo){
    case 'roll':roll();break;
    case 'rollall':if(busy)break;S=init();S.held=[false,false,false,false,false];S.rolls=0;S.dice=null;roll();break;
    case 'yacht':if(busy)break;S=init();roll([4,4,4,4,4]);break;
    case 'score':if(busy)break;if(S.result||S.turn!==0||S.rolls<1){S=init();render()}score(bestPick());break;
    case 'result':if(busy)break;S.result=!S.result;S.celebrate=null;render();if(S.result&&!reduce()&&T.result)frames.forEach(function(f){T.result(f)});break;
    case 'reset':if(busy)break;S=init();render();break;
    case 'theme':root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';break;
    case 'motion':motionReduce=!motionReduce;applyMotion();break;
  }
});
setInterval(function(){
  if(S.result)return;S.seconds=S.seconds<=0?30:S.seconds-1;
  frames.forEach(function(f){var n=f.querySelector('.yt-count-num');if(!n)return;n.textContent=S.seconds;n.parentNode.classList.toggle('yt-countdown-urgent',S.seconds<=5)});
},1000);
applyMotion();render();
})();

</script>
</body>
