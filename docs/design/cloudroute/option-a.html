<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>구름항로 시안 A — 솜구름 그림책</title>
<!-- D-185 디자인 시안. 앱 코드와 무관한 단독 파일(외부 의존 없음). 그림은 전부 SVG·CSS. -->
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:14px/1.45 var(--font);overflow-x:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.lab{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;background:#14161aee;color:#eee;font:12px/1.3 system-ui,sans-serif}
.lab b{margin-right:auto;font-size:13px}
.lab button,.lab a{border:1px solid #fff4;background:#ffffff14;color:#eee;border-radius:6px;padding:5px 9px;text-decoration:none;min-height:30px}
.lab button[aria-pressed=true],.lab a[aria-current]{background:#fff;color:#111}
.lab .go{background:#ffd34d;color:#111;border-color:#ffd34d;font-weight:700}
.lab .row{display:flex;flex-wrap:wrap;gap:6px;flex-basis:100%}
#chips{display:contents}
.note{max-width:1000px;margin:10px auto 30px;padding:0 14px;font:12px/1.5 system-ui,sans-serif;opacity:.75}
.frame{margin:14px auto;max-width:1000px;padding:0 12px}
.frame[data-view=phone]{width:375px;max-width:100%;padding:0;outline:6px solid #8885;outline-offset:2px}
.cr{container:cr/inline-size;position:relative;overflow:hidden;padding:12px;display:flex;flex-direction:column;gap:10px}
.hd{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hd .ttl{margin-right:auto}
.badge{padding:3px 9px;font-size:12px;white-space:nowrap;background:none;border:1px solid currentColor}
button.badge{min-height:32px}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;align-items:start}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.seats{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.seat{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:1px 8px;padding:8px 10px;min-width:0}
.seat .av{grid-row:1/3;width:34px;height:34px;display:block}
.seat .av svg,.rbox .av svg{width:100%;height:100%;display:block;overflow:visible}
.seat .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .nm small{font-weight:400;opacity:.7}
.seat .cash{font-variant-numeric:tabular-nums}
.seat .sub{grid-column:2/4;font-size:11px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-style:normal;font-weight:700;margin-left:auto}
.board{container:bd/inline-size;position:relative;aspect-ratio:1;display:grid;grid-template:repeat(7,minmax(0,1fr))/repeat(7,minmax(0,1fr));gap:3px}
.bg{position:absolute;inset:0;z-index:0;pointer-events:none}
.bg svg{width:100%;height:100%;display:block}
.tile{position:relative;z-index:1;min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;overflow:hidden;padding:4% 2% 0;text-align:center}
.tile .no{display:none}
.tile .art{width:42%;flex:none}
.tile svg{display:block;width:100%;overflow:visible}
.tile .nm{font-size:clamp(7.5px,1.72cqw,11.5px);line-height:1.12;word-break:keep-all;letter-spacing:-.03em;margin-top:2%}
.tile .pr{font-size:clamp(7px,1.45cqw,10px);font-variant-numeric:tabular-nums}
.tile .bld{position:absolute;right:3%;top:3%;width:32%;display:none}
.tile.own .bld{display:block}
.tile .fst{position:absolute;left:3%;top:3%;width:24%;display:none}
.tile.fest .fst{display:block}
.spin{transform-box:view-box;transform-origin:50% 41.7%;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.center{grid-area:2/2/7/7;z-index:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4cqw;padding:3cqw;min-width:0}
.dice{display:flex;gap:3cqw}
.die{width:12cqw;max-width:66px;min-width:38px;aspect-ratio:1;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:15%;gap:5%;place-items:center}
.die i{width:78%;aspect-ratio:1;border-radius:50%;background:currentColor;opacity:0}
.die i.on{opacity:1}
.turnline{margin:0;font-size:clamp(12px,2.7cqw,17px);text-align:center}
.log{list-style:none;margin:0;padding:0;width:100%;font-size:clamp(10px,2.05cqw,13px);text-align:center;display:grid;gap:2px}
.log li:nth-child(2){opacity:.7}.log li:nth-child(n+3){opacity:.5}
.deck{position:absolute;right:3cqw;bottom:3cqw;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:clamp(9px,1.7cqw,11px)}
.deck .dk{width:7cqw;min-width:24px;aspect-ratio:5/7;display:block}
.deck svg,.card svg{display:block;width:100%;height:100%}
.route{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;opacity:0;fill:none}
.route.on{opacity:1}
.tokens,.fxl{position:absolute;inset:0;z-index:4;pointer-events:none}
.fxl{z-index:7}
.tok{position:absolute;width:7.4cqw;min-width:21px;aspect-ratio:1;transform:translate(-50%,-50%);transition:left var(--hop) var(--hopease,ease),top var(--hop) var(--hopease,ease)}
.tok>span{display:block;width:100%;height:100%}
.tok svg{width:100%;height:100%;overflow:visible;display:block}
.tok.flying{z-index:5;transition:none}
.tok.gone{display:none}
.cardwrap{position:absolute;inset:0;z-index:6;display:grid;place-items:center;pointer-events:none;perspective:900px;visibility:hidden}
.cardwrap.show{visibility:visible}
.card{position:relative;width:36cqw;min-width:128px;max-width:230px;aspect-ratio:5/7;transform-style:preserve-3d}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.front{transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5%;padding:8%;text-align:center}
.card.flip{transform:rotateY(180deg)}
.front .ca{width:46%;display:block}
.front .ck{font-size:clamp(9px,1.9cqw,12px);letter-spacing:.12em}
.front .cn{font-size:clamp(14px,3.3cqw,21px)}
.front .ce{font-size:clamp(11px,2.2cqw,14px)}
.fx{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.coin,.p{position:absolute;left:0;top:0;width:18px;height:18px;margin:-9px;display:block}
.coin svg,.p svg{width:100%;height:100%;display:block;overflow:visible}
.pop{position:absolute;z-index:8;left:50%;top:-4px;white-space:nowrap;font-weight:800;font-size:13px;pointer-events:none;animation:pop 1.4s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,8px) scale(.7)}18%{opacity:1;transform:translate(-50%,-8px) scale(1.12)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
.panel{padding:12px;display:flex;flex-direction:column;gap:8px;min-height:150px}
.panel h3{margin:0;font-size:15px}
.panel h3 small{font-weight:400;font-size:11px}
.panel p{margin:0;font-size:13px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.btn{min-height:44px;padding:8px 14px;flex:1 1 auto}
.btn small{display:block;font-size:10px;font-weight:400}
.lv{display:flex;gap:6px}
.lv button{flex:1;min-height:44px;display:flex;flex-direction:column;align-items:center;font-size:11px;padding:5px 2px;min-width:0}
.lv svg{width:26px;height:26px;overflow:visible}
.result{position:absolute;inset:0;z-index:30;display:grid;place-items:start center;padding:70px 14px 14px}
.result[hidden]{display:none}
.rbox{width:min(400px,100%);padding:18px;animation:rin .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes rin{from{opacity:0;transform:translateY(20px) scale(.92)}}
.rbox h2{margin:2px 0}.rbox p{margin:0}
.rbox ol{list-style:none;margin:12px 0;padding:0;display:grid;gap:6px}
.rbox li{display:grid;grid-template-columns:22px 30px 1fr auto;gap:8px;align-items:center;padding:6px 8px}
.rbox .av{width:30px;height:30px;display:block}
.rbox li b{font-variant-numeric:tabular-nums}
@container cr (max-width:700px){
 .cr{padding:8px;gap:8px}
 .lay{grid-template-columns:minmax(0,1fr);gap:8px}
 .side{display:contents}
 .seats{order:-1;grid-template-columns:1fr 1fr;gap:6px}
 .seat{padding:6px 8px;gap:0 6px}
 .seat .av{width:26px;height:26px}
 .seat .sub span:nth-child(2){display:none}
 .hd .badge:nth-child(4),.hd .badge:nth-child(5){display:none}
}
@container bd (max-width:470px){.tile .pr{display:none}.log li:nth-child(n+3){display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}}
[data-motion=reduce] *,[data-motion=reduce] *::before,[data-motion=reduce] *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}

/* ───────── 시안 A — 솜구름 그림책 ───────── */
:root{--font:ui-rounded,"SF Pro Rounded","Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
--page:#fdf3e7;--ink:#45385a;--paper:#fffaf2;--edge:#e2d0bd;--sky1:#cdeaff;--sky2:#ffe3ee;--line:#e6d6c4;--accent:#ff8fab;--accent-d:#e0607f;--accent-ink:#4a1f3a;--gold:#8a5a00;--bad:#c2335b;--good:#157a52;--cardback:#7fb6ee;--cloud:#fffffff0;--rb:.6;
--s0:#3f86f5;--s1:#f0558a;--s2:#1faa74;--s3:#f08a1d;
--moss:#a9dd8c;--shell:#f9bdd0;--mushroom:#f6b085;--windmill:#b8d6f4;--glass:#9fe3e0;--star_apple:#f79a9a;--lava:#e39a85;--crown:#cdb0f5;--sp:#ffe9a8;
--hop:.26s;--hopease:cubic-bezier(.3,0,.4,1)}
:root[data-theme=dark]{--page:#1c172b;--ink:#f4ecff;--paper:#3a3256;--edge:#221c36;--sky1:#29284f;--sky2:#493461;--line:#5a4e80;--accent:#ff9fba;--accent-d:#c9607f;--accent-ink:#3a1228;--gold:#ffd66b;--bad:#ff9db3;--good:#86e6b8;--cardback:#5878c8;--cloud:#ffffff1f;--rb:.3;
--s0:#6aa5ff;--s1:#ff7fa8;--s2:#4fd29a;--s3:#ffab4a;
--moss:#5f9a55;--shell:#b96c84;--mushroom:#b87248;--windmill:#6689b3;--glass:#4a9c9b;--star_apple:#bd5a61;--lava:#a05846;--crown:#8368ba;--sp:#8a7636}
.cr{background:linear-gradient(160deg,var(--sky1),var(--sky2));border-radius:24px}
.badge{border:0;background:var(--paper);border-radius:999px;box-shadow:0 2px 0 var(--edge);font-weight:700}
.badge.ttl{background:var(--accent);color:var(--accent-ink);font-size:15px;padding:4px 14px;box-shadow:0 3px 0 var(--accent-d)}
.seat{background:var(--paper);border-radius:18px;box-shadow:0 3px 0 var(--edge);border:2.5px solid transparent}
.seat.turn{border-color:var(--c);animation:a-bob 1.8s ease-in-out infinite}
.seat .cash{color:var(--gold);font-size:15px}
.seat.out{filter:grayscale(1);opacity:.6}
.tag{background:color-mix(in srgb,var(--c) 22%,var(--paper));border:1.5px solid var(--c);border-radius:999px;padding:0 7px}
.tag.bad{border-color:var(--bad);color:var(--bad)}
@keyframes a-bob{50%{transform:translateY(-3px)}}
.board{gap:clamp(3px,.7vw,7px)}
.rb{opacity:var(--rb)}
.cl{fill:var(--cloud);animation:a-drift 12s ease-in-out infinite alternate}
.c2{animation-duration:16s;animation-direction:alternate-reverse}.c3{animation-duration:20s}
@keyframes a-drift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.tile{--isl:var(--sp);border-radius:20%;background:var(--paper);box-shadow:0 .6cqw 0 var(--edge)}
.tile::before{content:"";position:absolute;inset:0 0 46% 0;background:var(--isl);border-radius:0 0 50% 50%/0 0 26% 26%;z-index:-1}
.i-moss{--isl:var(--moss)}.i-shell{--isl:var(--shell)}.i-mushroom{--isl:var(--mushroom)}.i-windmill{--isl:var(--windmill)}.i-glass{--isl:var(--glass)}.i-star_apple{--isl:var(--star_apple)}.i-lava{--isl:var(--lava)}.i-crown{--isl:var(--crown)}
.i-letter,.i-station{--isl:var(--windmill)}.i-whirlpool{--isl:var(--crown)}.i-festival{--isl:var(--shell)}
.art .f{fill:#fffdf8;stroke:color-mix(in srgb,var(--isl) 45%,#4a3a5c);stroke-width:1.3;stroke-linejoin:round}
.art .a{fill:color-mix(in srgb,var(--isl) 45%,#4a3a5c)}
.art .d{fill:color-mix(in srgb,var(--isl) 75%,#fff)}
.art .l{fill:none;stroke:color-mix(in srgb,var(--isl) 45%,#4a3a5c);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.tile .nm{font-weight:700}
.tile .pr{color:var(--gold);font-weight:700}
.tile.own{outline:.6cqw solid var(--o);outline-offset:-.6cqw}
.tile.mono .nm::after{content:" ★";color:var(--gold)}
.bld,.lv svg{filter:drop-shadow(0 1px 0 #0003)}
.lv{--o:var(--s0)}
.bf{fill:var(--o);stroke:#fff;stroke-width:1;stroke-linejoin:round}.ba{fill:#ffe27a;stroke:var(--o);stroke-width:1.5;stroke-linejoin:round}.bw{fill:#fff;opacity:.9}.bd{fill:var(--o);stroke:#5d4c70;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fst{animation:a-swing 2s ease-in-out infinite alternate;transform-origin:50% 0}
.fst .f{fill:#ff6b6b;stroke:#fff;stroke-width:1}.fst .l{fill:none;stroke:#b33a3a;stroke-width:1.3}
@keyframes a-swing{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
.log li{justify-self:center;background:color-mix(in srgb,var(--paper) 82%,transparent);border-radius:999px;padding:2px 12px}
.turnline{background:var(--paper);border-radius:999px;padding:3px 16px;box-shadow:0 2px 0 var(--edge)}
.die{background:#fffdf8;border-radius:24%;box-shadow:0 .9cqw 0 #d6c6e2,0 1.4cqw 1.6cqw #0002;color:#f0558a}
.die+.die{color:#3f86f5}
.die.rolling{animation:a-roll .8s cubic-bezier(.3,0,.6,1)}
.die+.die.rolling{animation-direction:reverse;animation-delay:.06s}
.die.landed{animation:a-squash .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes a-roll{0%{transform:none}25%{transform:translateY(-75%) rotate(130deg) scale(1.1)}50%{transform:translateY(0) rotate(210deg) scale(1.12,.86)}75%{transform:translateY(-38%) rotate(300deg)}100%{transform:translateY(0) rotate(360deg)}}
@keyframes a-squash{0%{transform:scale(1.25,.7)}60%{transform:scale(.92,1.1)}100%{transform:none}}
.deck b{background:var(--paper);border-radius:99px;padding:0 6px}
.deck .dk{filter:drop-shadow(0 2px 0 var(--edge));transform:rotate(6deg)}
.tok{filter:drop-shadow(0 .3cqw 0 #0002)}
.tok.hop>span{animation:a-hop var(--hop) ease-out}
.tok.arrive>span{animation:a-squash .5s cubic-bezier(.3,1.8,.5,1);transform-origin:50% 100%}
.tok.flying>span{animation:a-fly 1.7s ease-in-out}
.tok.fx-out>span{animation:a-out 1.2s ease-in forwards}
@keyframes a-hop{0%{transform:scale(1.1,.88)}45%{transform:translateY(-60%) scale(.92,1.1)}100%{transform:none}}
@keyframes a-fly{0%{transform:none}20%{transform:translateY(-30%) scale(1.5) rotate(-8deg)}50%{transform:translateY(-40%) scale(1.9) rotate(6deg)}80%{transform:translateY(-30%) scale(1.5) rotate(-5deg)}100%{transform:none}}
@keyframes a-out{0%{transform:none}15%{transform:rotate(-16deg) scale(1.1)}30%{transform:rotate(16deg) scale(1.1);filter:none}45%{transform:rotate(-10deg) scale(.9);filter:grayscale(1)}100%{transform:translateY(160%) rotate(50deg) scale(.2);opacity:0;filter:grayscale(1)}}
.route path{stroke:var(--cloud);stroke-width:9;stroke-linecap:round;stroke-dasharray:.1 5}
.route.on path{animation:a-march 1.7s linear}
@keyframes a-march{from{stroke-dashoffset:20}to{stroke-dashoffset:0}}
.tile.pass{animation:a-pass .45s ease-out}
.tile.landed{animation:a-land .6s cubic-bezier(.3,1.8,.5,1)}
.tile.fx-claim,.tile.fx-built,.tile.fx-toll,.tile.fx-mono,.tile.fx-target{z-index:3;overflow:visible}
.tile.fx-claim{animation:a-claim .7s cubic-bezier(.3,1.7,.5,1)}
.bld.fx-build{animation:a-build .7s cubic-bezier(.3,1.9,.5,1);transform-origin:50% 100%}
.tile.fx-toll{animation:a-wig .8s ease-in-out}
.tile.fx-mono{animation:a-mono 1.1s ease-out}
.tile.fx-target{animation:a-blink .4s 3}
.tile.fx-release{animation:a-rel .5s ease-in}
.seat.fx-got{animation:a-claim .5s cubic-bezier(.3,1.7,.5,1)}
.seat.fx-out{animation:a-wig .8s ease-in-out}
@keyframes a-pass{40%{transform:translateY(7%) scale(.96)}}
@keyframes a-land{0%{transform:translateY(10%) scale(1.06,.9)}100%{transform:none}}
@keyframes a-claim{0%{transform:none}40%{transform:scale(1.28) rotate(-5deg)}100%{transform:none}}
@keyframes a-build{0%{transform:translateY(60%) scale(0)}100%{transform:none}}
@keyframes a-wig{20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
@keyframes a-mono{0%{box-shadow:0 0 0 0 #ffd34d}60%{box-shadow:0 0 0 1.6cqw #ffd34d99}100%{box-shadow:0 0 0 2.6cqw #ffd34d00}}
@keyframes a-blink{50%{outline:.8cqw solid var(--accent);outline-offset:-.8cqw}}
@keyframes a-rel{50%{filter:grayscale(1);transform:scale(.9) rotate(4deg)}}
.pop{background:var(--paper);border-radius:999px;padding:2px 10px;box-shadow:0 2px 0 var(--edge)}
.pop.gain{color:var(--good)}.pop.loss{color:var(--bad)}
.face{border-radius:9%;box-shadow:0 1cqw 0 var(--edge),0 2cqw 4cqw #0003}
.face.front{background:var(--paper);border:.9cqw solid var(--cardback);color:var(--ink)}
.front .ck{color:var(--gold);font-weight:700}
.card{transition:transform .6s cubic-bezier(.4,1.5,.5,1)}
.cardwrap.show .card{animation:a-cardin .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes a-cardin{from{transform:translate(32cqw,32cqw) scale(.15) rotate(50deg)}}
#card.fx-got{filter:brightness(1.1)}
.panel{background:var(--paper);border-radius:20px;box-shadow:0 3px 0 var(--edge)}
.btn{border:2px solid var(--line);border-radius:16px;background:var(--paper);box-shadow:0 4px 0 var(--edge);font-weight:700;transition:transform .1s,box-shadow .1s}
.btn.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-d);box-shadow:0 4px 0 var(--accent-d)}
.btn:active,.btn.pressed{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.lv button{border:2px solid var(--line);border-radius:14px;background:var(--paper);transition:transform .15s}
.lv button.on{border-color:var(--accent-d);background:color-mix(in srgb,var(--accent) 22%,var(--paper));transform:translateY(-3px)}
.lv b{color:var(--gold)}
.result{background:color-mix(in srgb,var(--sky1) 78%,transparent)}
.rbox{background:var(--paper);border-radius:26px;box-shadow:0 6px 0 var(--edge);text-align:center}
.rbox .rk{color:var(--gold);font-weight:700}
.rbox h2{font-size:26px}
.rbox li{background:color-mix(in srgb,var(--c) 14%,var(--paper));border-radius:14px;text-align:left}
.rbox li.me{outline:2.5px solid var(--c)}
.rbox li.bk{filter:grayscale(1);opacity:.65}
.rbox .rn{font-weight:800;text-align:center}
.rbox li b{color:var(--gold)}

</style>
</head>

function panel(h){$('#panel').innerHTML=h}
const goBtn=()=>`<div class="acts"><button class="btn main" data-go type="button">${T.dieIcon} 주사위 굴리기${step<STEPS.length?` <small>다음: ${STEPS[step].name}</small>`:' <small>처음부터 다시</small>'}</button></div>`;
const panelWait=h=>panel(`<h3>${NAMES[S.turn]} 차례</h3><p>${h}</p>`);
function panelBuy(i){const[nm,,p]=TILES[i];panel(`<h3>${nm} <small>조개섬 · 땅값 ${p}G</small></h3><p>살까요? 건물도 함께 지을 수 있어요.</p><div class="lv" role="radiogroup" aria-label="건설 단계">${[0,1,2].map(l=>`<button type="button" class="${l?'':'on'}" data-c="${p+l*p/2}">${bld(l)}<span>${LV[l]}</span><b>${p+l*p/2}G</b></button>`).join('')}</div><div class="acts"><button class="btn" type="button">안 산다</button><button class="btn main" type="button" id="buy">산다 · ${p}G</button></div>`)}
function press(el){if(!el||FAST)return;if(el.parentNode.classList.contains('lv')){$$('.lv button').forEach(b=>b.classList.toggle('on',b===el));$('#buy').textContent=`산다 · ${el.dataset.c}G`}fxc(el,'pressed',300)}
async function roll(a,b){const d=$$('.die');if(!quiet()){d.forEach(x=>x.classList.add('rolling'));const iv=setInterval(()=>d.forEach(x=>face(x,1+Math.random()*6|0)),90);await wait(T.ms.roll);clearInterval(iv);d.forEach(x=>x.classList.remove('rolling'))}
 face(d[0],a);face(d[1],b);d.forEach(x=>fxc(x,'landed',600));$('#tl').innerHTML=`${NAMES[S.turn]} — <b>${a} + ${b} = ${a+b}칸</b>`;await wait(480)}
async function move(s,n){const el=toks[s];for(let k=0;k<n;k++){const a=grid(S.pos[s]);S.pos[s]=(S.pos[s]+1)%24;const b=grid(S.pos[s]);
  el.style.setProperty('--hdg',Math.atan2(b.r-a.r,b.c-a.c)*180/Math.PI+'deg');
  if(S.pos[s]===0){money(s,200);popAt(0,'급여 +200G','gain');log(`<b>${NAMES[s]}</b> 출발 항구 통과 — 급여 200G`)}
  if(quiet())continue;place(s,true);fxc(el,'hop',T.ms.hop);fxc(tiles[S.pos[s]],'pass',900);await wait(T.ms.hop)}
 placeAll();fxc(el,'arrive',600);fxc(tiles[S.pos[s]],'landed',900);await wait(350)}
async function claim(i,s){S.own[i]=[s,0];drawTile(i);fxc(tiles[i],'fx-claim');burst(pt(tiles[i]),'buy');await wait(T.ms.claim)}
async function build(i,l){S.own[i][1]=l;drawTile(i);fxc($('.bld',tiles[i]),'fx-build');fxc(tiles[i],'fx-built');burst(pt(tiles[i]),'build');await wait(T.ms.build)}
async function card(n,e){const c=$('#card');$('.front',c).innerHTML=`<span class="ck">바람 편지</span><span class="ca">${T.cardArt}</span><b class="cn">${n}</b><span class="ce">${e}</span>`;S.deck--;$('#dkn').textContent=`편지 ${S.deck}`;
 if(FAST)return;$('#cw').classList.add('show');await wait(T.ms.cardIn);c.classList.add('flip');await wait(T.ms.cardFlip+1100)}
function hideCard(){$('#cw').classList.remove('show');$('#card').classList.remove('flip')}
async function fly(s,to){const el=toks[s],a=ctr(S.pos[s]),b=ctr(to),mx=50+((a.x+b.x)/2-50)*.05,my=50+((a.y+b.y)/2-50)*.05,rt=$('#route');
 S.pos[s]=to;if(!quiet()){rt.firstElementChild.setAttribute('d',`M${a.x} ${a.y}Q${mx} ${my} ${b.x} ${b.y}`);fxc(rt,'on',T.ms.fly+500);el.classList.add('flying');el.style.setProperty('--hdg','135deg');
  const kf=[];for(let i=0;i<=24;i++){const t=i/24,u=1-t;kf.push({left:u*u*a.x+2*u*t*mx+t*t*b.x+'%',top:u*u*a.y+2*u*t*my+t*t*b.y+'%'})}
  await el.animate(kf,{duration:T.ms.fly,easing:'ease-in-out'}).finished;el.classList.remove('flying')}
 placeAll();fxc(el,'arrive',600);fxc(tiles[to],'landed',900);await wait(300)}
async function bankrupt(s){S.out[s]=1;if(!quiet()){toks[s].classList.add('fx-out');fxc($('.seat.s'+s),'fx-out',1500);burst(pt(toks[s]),'out');await wait(T.ms.out)}
 for(const i of Object.keys(S.own).filter(i=>S.own[i][0]===s)){if(!quiet()){fxc(tiles[i],'fx-release',500);await wait(380)}delete S.own[i];drawTile(+i)}
 toks[s].classList.add('gone');drawSeats()}
function result(){const rk=[0,1,2,3].map(s=>({s,a:S.out[s]?-1:assets(s)})).sort((x,y)=>y.a-x.a);
 res.innerHTML=`<div class="rbox" role="dialog" aria-label="판 종료"><p class="rk">${T.kicker}</p><h2>${NAMES[rk[0].s]} 승리!</h2><p class="rr">라운드 상한 도달 — 자산 순위</p><ol>${rk.map((x,i)=>`<li class="${x.s?'':'me'}${x.a<0?' bk':''}" style="--c:var(--s${x.s})"><span class="rn">${i+1}</span><span class="av">${T.token(x.s)}</span><span class="nm">${NAMES[x.s]}${x.s?'':' (나)'}</span><b>${x.a<0?'파산':g(x.a)}</b></li>`).join('')}</ol><div class="acts"><button class="btn" type="button" data-close>판 다시 보기</button><button class="btn main" type="button" data-close>대기실로</button></div></div>`;
 res.hidden=false;if(!quiet()){const p={x:cr.clientWidth/2,y:Math.min(cr.clientHeight/2,260)};burst(p,'win');setTimeout(()=>burst({x:p.x-90,y:p.y+40},'win'),350);setTimeout(()=>burst({x:p.x+90,y:p.y+30},'win'),650)}}
const STEPS=[
{name:'구입·건설',run:async()=>{setTurn(0);panel(`<h3>내 차례</h3><p>주사위를 굴려 항로를 따라가요.</p>`);await roll(2,4);await move(0,6);
 panelBuy(5);await wait(1000);press($('.lv button:nth-child(2)'));await wait(600);press($('#buy'));await wait(300);
 money(0,-120);await claim(5,0);await build(5,1);drawTile(4);fxc(tiles[4],'fx-mono');fxc(tiles[5],'fx-mono');popAt(5,'조개섬 독점 ×1.5','gain');
 log('<b>하늘</b> 조개 시장 구입 + 천막 · 조개섬 독점');panelWait('조개 시장을 사고 천막을 지었어요. 조개섬 두 칸이 모두 내 땅 — 통행료 ×1.5');await wait(700)}},
{name:'통행료',run:async()=>{setTurn(1);panelWait('주사위를 굴리는 중…');await wait(350);await roll(3,4);await move(1,7);
 fxc(tiles[10],'fx-toll');popAt(10,'통행료 170G','loss');panelWait('보리가 내 <b>풍차 들판</b>(상점)에 도착 — 통행료 170G 를 받아요.');await wait(600);
 money(1,-170);await coins(toks[1],$('.seat.s0'),6);money(0,170);log('<b>보리</b> → <b>하늘</b> 통행료 170G');await wait(600)}},
{name:'바람 편지',run:async()=>{setTurn(2);panelWait('주사위를 굴리는 중…');await wait(350);await roll(2,4);await move(2,6);panelWait('도토리가 <b>바람 편지</b>를 한 장 뽑아요.');
 await card('별똥별 상자','120G 를 받는다');await coins($('#card'),$('.seat.s2'),5);money(2,120);hideCard();log('<b>도토리</b> 바람 편지 — 별똥별 상자 +120G');await wait(600)}},
{name:'비행',run:async()=>{setTurn(3);panelWait('주사위를 굴리는 중…');await wait(350);await roll(1,5);await move(3,6);
 panelWait('미르봇이 <b>바람 정류장</b>에서 50G 를 내고 날아갈 칸을 골라요.');await wait(600);money(3,-50);fxc(tiles[23],'fx-target');await wait(600);await fly(3,23);
 log('<b>미르봇</b> 바람 정류장 → 구름왕관 성채 (−50G)');await wait(500)}},
{name:'파산',run:async()=>{setTurn(1);panelWait('주사위를 굴리는 중…');await wait(350);await roll(2,4);await move(1,6);
 fxc(tiles[16],'fx-toll');popAt(16,'통행료 960G','loss');panelWait('보리가 <b>별사과 과수원</b>(풍등탑 · 축제 ×2)에 도착 — 960G 를 낼 수 없어요.');await wait(900);
 const c=S.cash[1];money(1,-c);await coins(toks[1],$('.seat.s2'),8);money(2,c);await bankrupt(1);log('<b>보리</b> 파산 — 땅 3곳이 주인 없는 땅으로');panelWait('보리가 파산했어요. 보리의 땅은 다시 살 수 있어요.');await wait(500)}},
{name:'결과 화면',run:async()=>{result()}}];
function idle(){$$('#panel [data-go]').forEach(b=>b.parentNode.remove());$('#panel').insertAdjacentHTML('beforeend',goBtn());$('#bGo').innerHTML=step<STEPS.length?`🎲 주사위 — ${STEPS[step].name}`:'↺ 처음으로';
 $$('#chips button').forEach((b,i)=>b.setAttribute('aria-pressed',i===step-1))}
function reset(){init();step=0;res.hidden=true;hideCard();drawAll();panel('<h3>내 차례</h3><p>주사위를 굴려 항로를 따라가요.</p>');idle()}
async function next(){if(busy)return;if(step>=STEPS.length){reset();return}busy=true;cr.classList.add('busy');await STEPS[step++].run();busy=false;cr.classList.remove('busy');idle()}
async function goto(i){if(busy)return;busy=true;init();res.hidden=true;hideCard();FAST=true;for(let j=0;j<i;j++)await STEPS[j].run();FAST=false;const o=S.out.slice();drawAll();o.forEach((x,s)=>x&&toks[s].classList.add('gone'));step=i;busy=false;next()}
$('#chips').innerHTML=STEPS.map((s,i)=>`<button type="button" data-i="${i}">${s.name}</button>`).join('');
$('#chips').onclick=e=>{const b=e.target.closest('button');if(b)goto(+b.dataset.i)};
$('#bGo').onclick=next;$('#bReset').onclick=()=>{if(!busy)reset()};
cr.addEventListener('click',e=>{if(e.target.closest('[data-go]'))next();if(e.target.closest('[data-close]'))res.hidden=true});
root.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
const tb=$('#bTheme'),vb=$('#bView'),mb=$('#bMotion'),fr=$('#frame');
const sync=()=>{tb.textContent=root.dataset.theme==='dark'?'라이트로':'다크로';vb.textContent=fr.dataset.view==='phone'?'데스크톱 폭':'375px 폭';mb.setAttribute('aria-pressed',root.dataset.motion==='reduce')};
tb.onclick=()=>{root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';sync()};
vb.onclick=()=>{fr.dataset.view=fr.dataset.view==='phone'?'desk':'phone';sync();requestAnimationFrame(placeAll)};
mb.onclick=()=>{root.dataset.motion=root.dataset.motion==='reduce'?'':'reduce';sync()};
addEventListener('resize',placeAll);sync();reset();
})();

</script>
</body>
</html>
