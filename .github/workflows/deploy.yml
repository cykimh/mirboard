name: Deploy

# D-105 (M4) — Fly.io 배포. **시크릿이 없으면 아무 일도 일어나지 않는다** —
# `FLY_API_TOKEN` 은 계정 소유자만 발급할 수 있으므로, 미설정 상태에서는 잡이
# 스스로 건너뛴다(실패로 빨갛게 만들지 않는다).
#
# 최초 1회 준비 (사용자):
#   flyctl auth token                          # 토큰 발급
#   gh secret set FLY_API_TOKEN --body "<토큰>"  # 또는 GitHub UI → Settings → Secrets
# 그 뒤 main 푸시마다 자동 배포되고, Actions 탭에서 수동 실행도 된다.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false # 배포는 중간에 끊지 않는다

jobs:
  deploy:
    name: Fly.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # CI 가 통과한 커밋만 배포한다 — 같은 이벤트에 대해 CI 워크플로가 병렬로 도는
    # 구조라, 여기서는 배포 전에 한 번 더 빌드해 최소 안전망을 둔다.
    steps:
      - uses: actions/checkout@v4

      - name: 시크릿 확인
        id: guard
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "FLY_API_TOKEN 미설정 — 배포를 건너뜁니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 25 (Temurin)
        if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Node
        if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      # 배포 전 최소 게이트 — 타입·단위 테스트가 깨진 채로 프로덕션에 나가지 않게.
      # (전체 IT 는 CI 워크플로가 담당한다. 여기서 Testcontainers 를 또 돌리면
      #  배포가 20분씩 걸린다.)
      - name: 클라 검증
        if: steps.guard.outputs.ready == 'true'
        run: |
          npm --prefix client ci
          npm --prefix client run build:check
          npm --prefix client run test

      - name: 서버 컴파일
        if: steps.guard.outputs.ready == 'true'
        run: ./gradlew :server:compileJava :server:compileTestJava --no-daemon

      # 이 잡은 FLY_API_TOKEN 을 쥐고 있다. 여기서 설치한 바이너리를 바로 다음 스텝이
      # 토큰과 함께 실행하므로, 서드파티 액션은 이동 가능한 브랜치(@master)가 아니라
      # 커밋 SHA 로 고정한다 — master 가 오염되면 토큰이 그대로 넘어간다.
      - name: flyctl 설치
        if: steps.guard.outputs.ready == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master @ 2026-04-08

      - name: 배포
        if: steps.guard.outputs.ready == 'true'
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
