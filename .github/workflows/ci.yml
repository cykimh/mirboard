name: CI

on:
  push:
    branches: [main]
  pull_request:

# 동시 실행 — 같은 branch 의 이전 run 은 취소 (PR force-push 시 자원 절약).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (unit + IT)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Testcontainers 가 자체 컨테이너를 띄우므로 `services:` 블록이 필요 없다 —
    # Docker daemon 은 Ubuntu runner 에 기본 설치되어 있다.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Gradle test
        run: ./gradlew :server:test --no-daemon

      - name: Archive test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-reports
          path: |
            server/build/reports/tests/test/**
            server/build/test-results/test/**
          retention-days: 7

  client:
    name: Client (build + unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm --prefix client ci

      - name: Type check
        run: npm --prefix client run build:check

      - name: Unit tests
        run: npm --prefix client run test

      - name: Production build
        run: npm --prefix client run build

  bundle-jar:
    name: Bundled jar smoke (server + client static) + E2E
    runs-on: ubuntu-latest
    needs: [server, client]
    timeout-minutes: 25
    # E2E(client/e2e) — 묶은 jar 를 운영과 같은 모양(한 출처에서 SPA + /api + /ws)으로 띄우고 게스트 → 세 게임 봇과 연습을 돈다.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mirboard
          POSTGRES_PASSWORD: mirboardpw
          POSTGRES_DB: mirboard
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mirboard" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build bundled jar
        run: ./gradlew :server:bootJar -PbundleClient --no-daemon

      - name: Verify client assets bundled
        run: |
          set -e
          JAR=$(ls server/build/libs/server-*.jar | head -1)
          echo "Inspecting $JAR"
          unzip -l "$JAR" | grep -E 'static/(index.html|cards/)' | head -5
          unzip -l "$JAR" | grep -q 'BOOT-INF/classes/static/index.html'

      - name: Start bundled jar
        run: |
          JAR=$(ls server/build/libs/server-*.jar | grep -v plain | head -1)
          nohup java -jar "$JAR" > server.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/login || true)
            if [ "$code" = "200" ]; then echo "up after $((i*2))s"; exit 0; fi
            sleep 2
          done
          cat server.log; exit 1

      - name: Install client deps + Chromium
        run: |
          npm --prefix client ci
          npx --prefix client playwright install --with-deps chromium

      - name: E2E (guest → 세 게임 봇과 연습)
        working-directory: client
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test

      - name: Archive E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            client/test-results/**
            server.log
          retention-days: 7
