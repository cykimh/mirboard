# Spring TestContext 컨텍스트 캐시 상한(기본 32). IT 는 클래스마다 자기 Testcontainers 를 띄워
# 컨텍스트 키가 매번 달라서 캐시 재사용이 사실상 없다. 그런데도 32개를 붙잡고 있으면 힙을 다 쓰고,
# 컨테이너가 내려간 옛 컨텍스트의 데드라인 폴러가 250ms 마다 'LettuceConnectionFactory has been
# STOPPED' 로 실패하며 돈다. 상한을 낮추면 밀려난 컨텍스트가 닫혀 폴러도 멈춘다(D-122 검증 중 발견).
spring.test.context.cache.maxSize=4
