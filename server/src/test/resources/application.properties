# 테스트 전역 기본값.
#
# D-90 — 통합테스트는 같은 IP(127.0.0.1)에서 register/login 을 다수 호출하므로
# 레이트리밋을 전역 비활성화한다(프로덕션 기본값은 application.yml 유지).
# 레이트리밋 자체를 검증하는 테스트는 @TestPropertySource 에 다음을 명시해 켠다:
#   "mirboard.ratelimit.enabled=true" + 필요한 버킷 limit/window
#
# D-84 때는 auth 버킷 하나뿐이라 `mirboard.ratelimit.auth.limit` 을 크게 잡았는데,
# D-90 에서 버킷 카탈로그(`...buckets.{name}.limit`)로 옮기며 그 키가 아무 것도
# 가리키지 않게 돼 IT 13건이 429 로 깨졌다. 개별 버킷 값이 아니라 기능 스위치를
# 쓰면 새 버킷이 추가돼도 같은 방식으로 안 깨진다.
mirboard.ratelimit.enabled=false

# D-113 — 통합 테스트는 반드시 자기 컨테이너(Testcontainers)를 쓴다. 기본 주소를 존재할 수
# 없는 호스트로 덮어, 컨테이너를 빠뜨린 IT 가 개발자 머신의 compose Postgres/Redis
# (application.yml 기본값 127.0.0.1)에 조용히 붙는 대신 **로컬에서도 즉시 실패**하게 한다.
# 이 줄이 없던 시절 CI 는 21회 연속 실패했는데 로컬은 늘 그린이었고, 한 IT 는 매 테스트
# 개발 Redis 를 flushDb 했다. 컨테이너를 쓰는 IT 는 @ServiceConnection /
# @DynamicPropertySource 가 이 값보다 우선하므로 영향이 없다.
spring.datasource.url=jdbc:postgresql://use-testcontainers.invalid:5432/none
spring.data.redis.host=use-testcontainers.invalid
