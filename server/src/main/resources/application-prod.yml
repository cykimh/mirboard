# Phase 7-3 (D-39) — Fly.io 배포 시 활성화되는 프로필 (SPRING_PROFILES_ACTIVE=prod).
#
# 시크릿은 모두 환경 변수로 주입한다 (`flyctl secrets set ...`). 이 파일에는
# 평문 시크릿을 절대 두지 않는다.
#
# 필수 환경 변수:
#   MIRBOARD_JWT_SECRET       JWT HS256 키 (32바이트 이상)
#   MIRBOARD_DB_URL           jdbc:postgresql://... (Fly Postgres / Supabase / Neon)
#   MIRBOARD_DB_USER          Postgres 사용자
#   MIRBOARD_DB_PASSWORD      Postgres 비밀번호
#   MIRBOARD_REDIS_HOST       mirboard-redis.internal (D-114 — Fly 자체 Redis 앱)
#   MIRBOARD_REDIS_PORT       6379
#   MIRBOARD_REDIS_PASSWORD   mirboard-redis 의 REDIS_PASSWORD 와 같은 값
#
# 선택:
#   MIRBOARD_MESSAGING_GATEWAY  redis (멀티 머신 가능 — fly.toml 에서 이미 설정)

spring:
  datasource:
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1

  jpa:
    properties:
      hibernate.format_sql: false

  data:
    redis:
      ssl:
        # 기본값 true 는 매니지드 Redis(D-39 Upstash) 시절의 안전한 기본. D-114 의 Fly 자체
        # Redis 는 사설망이라 시크릿 MIRBOARD_REDIS_SSL=false 로 끈다.
        enabled: ${MIRBOARD_REDIS_SSL:true}

# Phase 6D — 멀티 인스턴스 fan-out 기본값을 redis 로. fly.toml [env] 에서도 셋팅했지만
# yml override 로 안전망 한 겹 더.
mirboard:
  messaging:
    gateway: ${MIRBOARD_MESSAGING_GATEWAY:redis}
  security:
    # D-83 — prod origin 화이트리스트. 실제 배포 도메인을 MIRBOARD_ALLOWED_ORIGINS 로 주입.
    allowed-origins: ${MIRBOARD_ALLOWED_ORIGINS:https://mirboard.fly.dev}
  ratelimit:
    # D-117 — 레이트리밋 IP 의 정본. Fly 프록시가 채우는 헤더만 믿는다. remoteAddr 는
    # framework 전략에서 클라가 써 넣을 수 있는 X-Forwarded-For 맨 왼쪽 값이라 쓰지 않는다.
    client-ip-header: ${MIRBOARD_CLIENT_IP_HEADER:Fly-Client-IP}

server:
  forward-headers-strategy: framework
  # Fly proxy 뒤 — 실제 origin 은 X-Forwarded-* 헤더로 들어옴.
  # D-117 — 아래 tomcat.remoteip.* 는 헤더 이름이 설정돼 있으면 전략과 무관하게 RemoteIpValve 를
  # 등록한다(Boot 의 하위호환 동작 — 4.0.1 바이트코드로 확인). 하지만 그 뒤 framework 전략의
  # ForwardedHeaderFilter 가 남은 X-Forwarded-For·Forwarded 의 맨 왼쪽 값으로 remoteAddr 를 다시
  # 덮으므로, 클라가 그 헤더를 써 넣으면 remoteAddr 는 여전히 위조된다. 그래서 레이트리밋 IP 는
  # remoteAddr 가 아니라 위 client-ip-header 가 정본이다. 이 블록은 scheme(HTTPS) 판정에도
  # 관여해 HSTS 를 흔들 수 있으므로 이번에는 건드리지 않는다.
  tomcat:
    remoteip:
      protocol-header: x-forwarded-proto
      remote-ip-header: x-forwarded-for

logging:
  level:
    root: INFO
    com.mirboard: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
