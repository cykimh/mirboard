spring:
  application:
    name: mirboard

  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      # 아바타 업로드(D-80). 서버에서 128px PNG 로 재인코딩하므로 원본 한도만 둔다.
      max-file-size: 4MB
      max-request-size: 5MB

  datasource:
    # Phase 7-1 (D-39) — PostgreSQL 16. MIRBOARD_DB_URL 로 전체 jdbc URL 을
    # 통째로 덮어쓸 수도 있고 (Fly/Supabase 형 secret), 그렇지 않으면 호스트/포트/디비
    # 조각을 조합한다. 기본 포트 5432.
    url: ${MIRBOARD_DB_URL:jdbc:postgresql://${MIRBOARD_DB_HOST:127.0.0.1}:${MIRBOARD_DB_PORT:5432}/${MIRBOARD_DB_NAME:mirboard}}
    username: ${MIRBOARD_DB_USER:mirboard}
    password: ${MIRBOARD_DB_PASSWORD:mirboardpw}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${MIRBOARD_REDIS_HOST:127.0.0.1}
      port: ${MIRBOARD_REDIS_PORT:6379}
      # Phase 7-3 (D-39) — Upstash / 매니지드 Redis 는 비밀번호 + TLS 필수.
      # 로컬 docker-compose 는 둘 다 비활성. prod 에서는 application-prod.yml 가 강제.
      password: ${MIRBOARD_REDIS_PASSWORD:}
      ssl:
        enabled: ${MIRBOARD_REDIS_SSL:false}
      timeout: 2s

server:
  port: ${MIRBOARD_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        # Phase 6A-3 — health/info 외에 metrics + prometheus 노출.
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: mirboard
  prometheus:
    metrics:
      export:
        enabled: true

mirboard:
  jwt:
    secret: ${MIRBOARD_JWT_SECRET:dev-only-secret-please-override-with-32-bytes-min}
    expires-in: 12h
    issuer: mirboard
  security:
    # D-83 — CORS/WS origin 화이트리스트(콤마 구분). 전면 개방(*) 폐지.
    # dev=Vite(5173)/로컬(8080). prod 는 application-prod.yml 가 실도메인으로 override.
    allowed-origins: ${MIRBOARD_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  auth:
    lockout:
      # D-84 — 로그인 brute-force 잠금(Redis 전용, users 비침범).
      max-failures: ${MIRBOARD_LOGIN_MAX_FAILURES:5}
      window: ${MIRBOARD_LOGIN_FAIL_WINDOW:15m}
      lock-duration: ${MIRBOARD_LOGIN_LOCK_DURATION:15m}
  ratelimit:
    auth:
      # D-84 — 인증 엔드포인트 IP 고정 윈도 레이트리밋(Lua 원자).
      limit: ${MIRBOARD_RATELIMIT_AUTH_LIMIT:20}
      window: ${MIRBOARD_RATELIMIT_AUTH_WINDOW:1m}
  moderation:
    # D-86 — 채팅 금칙어(같은 길이 '*' 마스킹, 대소문자 무시). 운영자가 콤마로 커스터마이즈.
    # 자모 분리 우회 등 고급 회피 대응은 범위 밖. 비우면 마스킹 없음. (예시: 비속어)
    banned-words: ${MIRBOARD_BANNED_WORDS:비속어}
  messaging:
    # Phase 6D — 멀티 인스턴스 fan-out 모드. in-memory (default, 단일 인스턴스) 또는 redis.
    # redis 로 전환 시 STOMP broadcast 와 도메인 이벤트가 Redis Pub/Sub 위에서 흐른다.
    gateway: ${MIRBOARD_MESSAGING_GATEWAY:in-memory}
  bot:
    # 봇 액션 사이 딜레이(ms) — 사람 페이스 흉내 + 클라 UI 따라잡기. 기본 200(거의
    # 즉시) 은 체감이 없어 700 으로 상향(D-76 후속). 봇 구동 IT 는 0 으로 override.
    delay-millis: ${MIRBOARD_BOT_DELAY_MILLIS:700}
  desertion:
    # IN_GAME 탈주(끊김 후 미복귀) 확정까지 유예(초). 모바일은 백그라운드(앱 전환·
    # 화면 잠금) 시 소켓이 ~10-15s 만에 죽어, 30s 로는 잠깐 자리만 비워도 탈주로
    # 처리될 위험이 크다. 모바일 운영을 감안해 120s 로 상향(D-79). ReconnectBanner 가
    # 3분에 장시간 경고하므로 그 안쪽. 명시적 '나가기' 는 유예 없이 즉시 탈주(불변).
    grace-seconds: ${MIRBOARD_DESERTION_GRACE_SECONDS:120}

logging:
  pattern:
    # MDC (userId / roomId / eventId) 를 로그 라인에 자동 부착. 비어있으면 "-" 표시.
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} [user=%X{userId:--} room=%X{roomId:--} event=%X{eventId:--}] - %msg%n"
  level:
    root: INFO
    com.mirboard: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
