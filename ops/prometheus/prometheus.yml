# D-107 (C3) — 로컬 관측 스택용 스크랩 설정.
# 서버는 호스트에서 돌고(gradle bootRun) Prometheus 는 컨테이너라, 컨테이너에서
# 호스트를 가리키는 host.docker.internal 을 쓴다. Linux 에서는 compose 의
# extra_hosts 가 이 이름을 게이트웨이로 매핑해 준다.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: mirboard
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          application: mirboard
